spring.application.name=suspel-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:suspeldb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Amazon Cognito (IDaaS) - reemplazar <USER_POOL_ID> y <REGION> cuando exista el User Pool (Bloque C)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_3xGcPKuwF
suspel.security.scope=suspel-api/productos-access

# Origen permitido para el frontend Angular (dev). Agregar el origin de produccion cuando exista.
suspel.cors.allowed-origins=http://localhost:4200
